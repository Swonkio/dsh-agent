# dsh-tui profile patch — TEMPLATE
#
# Copy to ~/.dsh/profiles/tui/cordis.patch.yml and edit the marked lines.
# Everything here is applied on top of the base bundle.

# The LLM session titler makes a second model request right after the first
# prompt. A local server that holds one model and serves one request at a time
# queues that request AHEAD of the turn you are waiting on. Remove this row if
# your backend has spare capacity.
- id: session-title-llm
  disabled: true

# Auto-compaction fires at 80% of the routed model's context window.
# Do not lower it far: compaction REWRITES the prompt prefix and so invalidates
# the KV cache, which on a warm session serves the large majority of input
# tokens. Firing it more often trades a cheap large prefix for repeated full
# re-prefills.
- id: compaction-basic
  config:
    thresholdRatio: 0.8
    # Sized for a thinking model: reasoning tokens are spent against this same
    # cap, so a smaller value gets eaten by deliberation and the summary is cut
    # off mid-write — which compaction fails closed on.
    maxTokens: 24576

# Tool results are trimmed only when genuinely large. Measured over 313 real
# results: p50 was 349 chars and p99 was 45,767 — the mass is a handful of huge
# outputs, not many medium ones, so cutting earlier would lose information the
# agent needs while saving little.
- id: tool-result-pruner
  config:
    thresholdChars: 5000
    headChars: 3072
    tailChars: 768

# ── web ─────────────────────────────────────────────────────────────────────
- id: web
  config:
    # searxng needs a SearXNG instance; drop this line to use the bundled
    # DeepSeek search instead (which needs DEEPSEEK_API_KEY).
    searchProvider: searxng
    fetchProvider: readable

- insert:
    # EDIT: point at your own SearXNG, or remove this row and the line above.
    - id: web-search-searxng
      name: 'dsh-web-searxng'
      config:
        baseUrl: http://127.0.0.1:8888
        timeoutMs: 15000
        maxResults: 10

    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'

    # Article extraction before markdown conversion. The shipped provider
    # returns the whole document and the consumer converts ALL of it, chrome
    # included — one Wikipedia article measured ~21k tokens whose first eight
    # lines were "Jump to content", "Main menu" and similar. This brings the
    # same page back at ~4k tokens with headings, lists and links intact, and
    # passes link-index pages through untouched.
    - id: web-fetch-readable
      name: 'dsh-web-readable'

# A fetch tool lets the MODEL choose the request target, which is an SSRF
# surface. Enabling it is a considered trade for an agent that reads docs.
- id: tool-web
  config:
    fetch: true
    searchTimeoutMs: 60000

# ── project memory ──────────────────────────────────────────────────────────
- id: agent-instructions
  config:
    maxBytes: 65536
    instructionFileCandidates: [ AGENTS.md, CLAUDE.md, QWEN.md ]

- insert:
    - id: tool-remember
      name: 'dsh-memory'
      config:
        filename: QWEN.md

